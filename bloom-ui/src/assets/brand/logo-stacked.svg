<?xml version="1.0" encoding="UTF-8"?>
<!-- Bloom Community – Stacked Logo (flower top + wordmark below, Fredoka) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-label="Bloom">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;display=swap');
      .wordmark { font-family: 'Fredoka', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 72px; letter-spacing: -0.02em; }
      .tagline { font-family: 'Fredoka', system-ui, sans-serif; font-weight: 500; font-size: 14px; letter-spacing: 0.3em; }
    </style>
    <radialGradient id="petalGrad-s" cx="50%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#FFE6EF"/>
      <stop offset="48%" stop-color="#FFB7D5"/>
      <stop offset="100%" stop-color="#FF8FBC"/>
    </radialGradient>
    <radialGradient id="centerGrad-s" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#FFF4D4"/>
      <stop offset="55%" stop-color="#F0C27B"/>
      <stop offset="100%" stop-color="#D9A862"/>
    </radialGradient>
    <linearGradient id="textGrad-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B5B7E"/>
      <stop offset="100%" stop-color="#4A3B5C"/>
    </linearGradient>
    <linearGradient id="haloGrad-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A8E9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFB7D5" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="softShadow-s" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offBlur"/>
      <feFlood flood-color="#FF8FBC" flood-opacity="0.4"/>
      <feComposite in2="offBlur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Halo backdrop -->
  <circle cx="120" cy="110" r="92" fill="url(#haloGrad-s)"/>

  <!-- Flower -->
  <g transform="translate(120 110) scale(1.45)" filter="url(#softShadow-s)">
    <g>
      <path d="M 0 0 C -11 -3 -21 -24 -9 -38 C -4 -43 0 -43 0 -43 C 0 -43 4 -43 9 -38 C 21 -24 11 -3 0 0 Z"
            fill="url(#petalGrad-s)" stroke="#FF8FBC" stroke-width="0.6" transform="rotate(0)"/>
      <path d="M 0 0 C -11 -3 -21 -24 -9 -38 C -4 -43 0 -43 0 -43 C 0 -43 4 -43 9 -38 C 21 -24 11 -3 0 0 Z"
            fill="url(#petalGrad-s)" stroke="#FF8FBC" stroke-width="0.6" transform="rotate(72)"/>
      <path d="M 0 0 C -11 -3 -21 -24 -9 -38 C -4 -43 0 -43 0 -43 C 0 -43 4 -43 9 -38 C 21 -24 11 -3 0 0 Z"
            fill="url(#petalGrad-s)" stroke="#FF8FBC" stroke-width="0.6" transform="rotate(144)"/>
      <path d="M 0 0 C -11 -3 -21 -24 -9 -38 C -4 -43 0 -43 0 -43 C 0 -43 4 -43 9 -38 C 21 -24 11 -3 0 0 Z"
            fill="url(#petalGrad-s)" stroke="#FF8FBC" stroke-width="0.6" transform="rotate(216)"/>
      <path d="M 0 0 C -11 -3 -21 -24 -9 -38 C -4 -43 0 -43 0 -43 C 0 -43 4 -43 9 -38 C 21 -24 11 -3 0 0 Z"
            fill="url(#petalGrad-s)" stroke="#FF8FBC" stroke-width="0.6" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="12" fill="url(#centerGrad-s)"/>
    <circle cx="-3.5" cy="-4" r="4" fill="#FFF9F5" opacity="0.7"/>
    <circle cx="4" cy="-1" r="1.3" fill="#D9A862"/>
    <circle cx="-1" cy="4" r="1.3" fill="#D9A862"/>
  </g>

  <!-- Wordmark -->
  <text x="120" y="235" text-anchor="middle" class="wordmark" fill="url(#textGrad-s)">bloom</text>

  <!-- Tagline -->
  <text x="120" y="270" text-anchor="middle" class="tagline" fill="#9B8DB0">C O M M U N I T Y</text>

  <!-- Sparkles -->
  <g fill="#FFE8A8" opacity="0.85">
    <path d="M 44 48 l 1.6 -6 l 1.6 6 l 6 1.6 l -6 1.6 l -1.6 6 l -1.6 -6 l -6 -1.6 Z"/>
    <path d="M 196 56 l 1.4 -5 l 1.4 5 l 5 1.4 l -5 1.4 l -1.4 5 l -1.4 -5 l -5 -1.4 Z"/>
    <path d="M 190 170 l 1.2 -4 l 1.2 4 l 4 1.2 l -4 1.2 l -1.2 4 l -1.2 -4 l -4 -1.2 Z"/>
  </g>
</svg>
