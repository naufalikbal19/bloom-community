<?xml version="1.0" encoding="UTF-8"?>
<!-- Bloom intro — 1800ms splash animation (once).
     Choreography:
     0-200ms   gold center bursts in (scale 0 → 1.1 → 1, bouncy)
     200-800ms 5 petals stagger (80ms apart), scale 0→1 + spin -180°→0°
     600-1200ms wordmark letter-by-letter fade+slide
     800-1800ms shimmer sweep across text + sparkle burst radial
     1400-1800ms falling kelopak particles drift down -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Bloom intro">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;display=swap');
      .wm { font-family: 'Fredoka', system-ui, sans-serif; font-weight: 700; font-size: 92px; letter-spacing: -0.02em; }
    </style>
    <radialGradient id="petG" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFE6EF"/>
      <stop offset="48%" stop-color="#FFB7D5"/>
      <stop offset="100%" stop-color="#FF8FBC"/>
    </radialGradient>
    <radialGradient id="ctrG" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#FFF4D4"/>
      <stop offset="55%" stop-color="#F0C27B"/>
      <stop offset="100%" stop-color="#D9A862"/>
    </radialGradient>
    <linearGradient id="txG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B5B7E"/>
      <stop offset="100%" stop-color="#4A3B5C"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#FFF9F5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFF9F5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF9F5" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2" result="offBlur"/>
      <feFlood flood-color="#FF8FBC" flood-opacity="0.4"/>
      <feComposite in2="offBlur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Single petal reused -->
    <g id="petal">
      <path d="M 0 0 C -11 -3 -21 -24 -9 -38 C -4 -43 0 -43 0 -43 C 0 -43 4 -43 9 -38 C 21 -24 11 -3 0 0 Z"
            fill="url(#petG)" stroke="#FF8FBC" stroke-width="0.6"/>
    </g>
    <!-- Reusable sparkle star -->
    <g id="spark">
      <path d="M 0 -6 L 1.4 -1.4 L 6 0 L 1.4 1.4 L 0 6 L -1.4 1.4 L -6 0 L -1.4 -1.4 Z" fill="#FFE8A8"/>
    </g>
  </defs>

  <!-- "bl" letter 1 -->
  <text x="30" y="138" class="wm" fill="url(#txG)" opacity="0">
    bl
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-12 0" to="0 0" begin="0.6s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
  </text>
  <text x="200" y="138" class="wm" fill="url(#txG)" opacity="0">
    om
    <animate attributeName="opacity" from="0" to="1" begin="0.72s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="12 0" to="0 0" begin="0.72s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
  </text>

  <!-- Shimmer wipe across wordmark 0.9s - 1.4s -->
  <rect x="0" y="60" width="60" height="110" fill="url(#shimmer)" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.5;1" begin="0.9s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="340 0" begin="0.9s" dur="0.5s" fill="freeze"/>
  </rect>

  <!-- Flower in-place -->
  <g transform="translate(158 90)" filter="url(#shadow)">
    <!-- Petals group with staggered bloom -->
    <g>
      <!-- petal 1 (top) -->
      <g opacity="0">
        <use href="#petal"/>
        <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.25s" fill="freeze"/>
        <animateTransform attributeName="transform" type="rotate" from="-180" to="0" begin="0.2s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </g>
      <!-- petal 2 (72) -->
      <g opacity="0" transform="rotate(72)">
        <use href="#petal"/>
        <animate attributeName="opacity" from="0" to="1" begin="0.28s" dur="0.25s" fill="freeze"/>
        <animateTransform attributeName="transform" type="rotate" from="-108" to="72" begin="0.28s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </g>
      <!-- petal 3 (144) -->
      <g opacity="0" transform="rotate(144)">
        <use href="#petal"/>
        <animate attributeName="opacity" from="0" to="1" begin="0.36s" dur="0.25s" fill="freeze"/>
        <animateTransform attributeName="transform" type="rotate" from="-36" to="144" begin="0.36s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </g>
      <!-- petal 4 (216) -->
      <g opacity="0" transform="rotate(216)">
        <use href="#petal"/>
        <animate attributeName="opacity" from="0" to="1" begin="0.44s" dur="0.25s" fill="freeze"/>
        <animateTransform attributeName="transform" type="rotate" from="36" to="216" begin="0.44s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </g>
      <!-- petal 5 (288) -->
      <g opacity="0" transform="rotate(288)">
        <use href="#petal"/>
        <animate attributeName="opacity" from="0" to="1" begin="0.52s" dur="0.25s" fill="freeze"/>
        <animateTransform attributeName="transform" type="rotate" from="108" to="288" begin="0.52s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1"/>
      </g>
    </g>

    <!-- Center -->
    <g>
      <circle cx="0" cy="0" r="12" fill="url(#ctrG)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0; 1.15; 0.95; 1" keyTimes="0; 0.5; 0.8; 1" begin="0s" dur="0.35s" fill="freeze"/>
      </circle>
      <circle cx="-3.5" cy="-4" r="4" fill="#FFF9F5" opacity="0">
        <animate attributeName="opacity" from="0" to="0.75" begin="0.1s" dur="0.2s" fill="freeze"/>
      </circle>
    </g>
  </g>

  <!-- Sparkle burst (begin ~1.2s) -->
  <g>
    <use href="#spark" x="90" y="60" opacity="0">
      <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.3; 1" begin="1.2s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-16 -20" begin="1.2s" dur="0.6s" fill="freeze"/>
    </use>
    <use href="#spark" x="225" y="40" opacity="0">
      <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.3; 1" begin="1.3s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="10 -14" begin="1.3s" dur="0.6s" fill="freeze"/>
    </use>
    <use href="#spark" x="400" y="80" opacity="0">
      <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.3; 1" begin="1.25s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="18 -22" begin="1.25s" dur="0.6s" fill="freeze"/>
    </use>
    <use href="#spark" x="140" y="178" opacity="0">
      <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.3; 1" begin="1.35s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-12 16" begin="1.35s" dur="0.6s" fill="freeze"/>
    </use>
    <use href="#spark" x="340" y="170" opacity="0">
      <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.3; 1" begin="1.4s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="20 20" begin="1.4s" dur="0.6s" fill="freeze"/>
    </use>
  </g>

  <!-- Falling cherry petals (bg flair) -->
  <g opacity="0.7">
    <path d="M 50 -20 C 46 -22 42 -16 46 -10 C 50 -6 54 -8 56 -14 C 58 -18 54 -20 50 -20 Z" fill="#FFD9E8">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="60 240" begin="1.0s" dur="2.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate" from="0 50 -15" to="300 50 -15" begin="1.0s" dur="2.2s" fill="freeze" additive="sum"/>
      <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.3;1" begin="1.0s" dur="2.2s" fill="freeze"/>
    </path>
    <path d="M 300 -20 C 296 -22 292 -16 296 -10 C 300 -6 304 -8 306 -14 C 308 -18 304 -20 300 -20 Z" fill="#FFB7D5">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 240" begin="1.3s" dur="2.0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate" from="0 300 -15" to="-280 300 -15" begin="1.3s" dur="2.0s" fill="freeze" additive="sum"/>
      <animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.3;1" begin="1.3s" dur="2.0s" fill="freeze"/>
    </path>
  </g>
</svg>
