<?xml version="1.0" encoding="UTF-8"?>
<!-- Bloom loading — 2400ms infinite loop.
     - Petals pulse opacity 0.7↔1 with 500ms phase shift between each
     - Center gold slow rotate 360° / 4s
     - Breathing scale 1.00↔1.03↔1.00
     - Floating sparkle (SMIL animateMotion) traverses pojok-pojok
     - Bokeh circles drift behind (CREATIVE flair) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="Bloom loading">
  <defs>
    <radialGradient id="petG-l" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFE6EF"/>
      <stop offset="48%" stop-color="#FFB7D5"/>
      <stop offset="100%" stop-color="#FF8FBC"/>
    </radialGradient>
    <radialGradient id="ctrG-l" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#FFF4D4"/>
      <stop offset="55%" stop-color="#F0C27B"/>
      <stop offset="100%" stop-color="#D9A862"/>
    </radialGradient>
    <radialGradient id="bokehG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD9E8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD9E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-l" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2" result="offBlur"/>
      <feFlood flood-color="#FF8FBC" flood-opacity="0.4"/>
      <feComposite in2="offBlur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="petal-l">
      <path d="M 0 0 C -11 -3 -21 -24 -9 -38 C -4 -43 0 -43 0 -43 C 0 -43 4 -43 9 -38 C 21 -24 11 -3 0 0 Z"
            fill="url(#petG-l)" stroke="#FF8FBC" stroke-width="0.6"/>
    </g>
    <path id="loop-path" d="M 20 20 Q 110 10 200 20 Q 210 110 200 200 Q 110 210 20 200 Q 10 110 20 20 Z"/>
  </defs>

  <!-- Bokeh drifting bg -->
  <g>
    <circle cx="40" cy="40" r="22" fill="url(#bokehG)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 18 10; 0 0; -14 -8; 0 0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="70" r="16" fill="url(#bokehG)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -14 12; 0 0; 12 -10; 0 0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="180" r="20" fill="url(#bokehG)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 16 -12; 0 0; -10 8; 0 0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Flower with breathing -->
  <g transform="translate(110 110)" filter="url(#shadow-l)">
    <animateTransform attributeName="transform" type="scale" values="1; 1.03; 1" dur="2.4s" repeatCount="indefinite" additive="sum"/>

    <!-- Petals: each pulses with 500ms phase shift -->
    <g>
      <g transform="rotate(0)">
        <use href="#petal-l"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
      </g>
      <g transform="rotate(72)">
        <use href="#petal-l"/>
        <animate attributeName="opacity" values="1;0.7;1" dur="2.4s" begin="-0.5s" repeatCount="indefinite"/>
      </g>
      <g transform="rotate(144)">
        <use href="#petal-l"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="-1.0s" repeatCount="indefinite"/>
      </g>
      <g transform="rotate(216)">
        <use href="#petal-l"/>
        <animate attributeName="opacity" values="1;0.7;1" dur="2.4s" begin="-1.5s" repeatCount="indefinite"/>
      </g>
      <g transform="rotate(288)">
        <use href="#petal-l"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="-2.0s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Rotating center -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="12" fill="url(#ctrG-l)"/>
      <circle cx="-3.5" cy="-4" r="4" fill="#FFF9F5" opacity="0.75"/>
      <circle cx="4" cy="-1" r="1.3" fill="#D9A862"/>
      <circle cx="-1" cy="4" r="1.3" fill="#D9A862"/>
    </g>
  </g>

  <!-- Traveling sparkle on loop path -->
  <g>
    <path d="M 0 -5 L 1.2 -1.2 L 5 0 L 1.2 1.2 L 0 5 L -1.2 1.2 L -5 0 L -1.2 -1.2 Z" fill="#FFE8A8" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" repeatCount="indefinite"/>
      <animateMotion dur="3s" repeatCount="indefinite" rotate="auto">
        <mpath href="#loop-path"/>
      </animateMotion>
    </path>
    <path d="M 0 -4 L 1 -1 L 4 0 L 1 1 L 0 4 L -1 1 L -4 0 L -1 -1 Z" fill="#FFCBA4" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
      <animateMotion dur="3s" begin="-1.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#loop-path"/>
      </animateMotion>
    </path>
  </g>
</svg>
