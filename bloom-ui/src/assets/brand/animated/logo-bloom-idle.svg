<?xml version="1.0" encoding="UTF-8"?>
<!-- Bloom idle — 4000ms infinite subtle watermark.
     - Overall opacity 0.6-0.8 (nggak boleh ganggu)
     - Center gentle pulse opacity 0.8↔1
     - 1 petal gentle sway ±5°
     - Soft inner-glow aura breathes 4s
     Reduced-motion fallback: just static (SMIL ignored by reduced-motion wrapper) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Bloom idle" opacity="0.72">
  <defs>
    <radialGradient id="petG-id" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFE6EF"/>
      <stop offset="48%" stop-color="#FFB7D5"/>
      <stop offset="100%" stop-color="#FF8FBC"/>
    </radialGradient>
    <radialGradient id="ctrG-id" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#FFF4D4"/>
      <stop offset="55%" stop-color="#F0C27B"/>
      <stop offset="100%" stop-color="#D9A862"/>
    </radialGradient>
    <radialGradient id="auraG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB7D5" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#FFB7D5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFB7D5" stop-opacity="0"/>
    </radialGradient>
    <g id="petal-id">
      <path d="M 0 0 C -11 -3 -21 -24 -9 -38 C -4 -43 0 -43 0 -43 C 0 -43 4 -43 9 -38 C 21 -24 11 -3 0 0 Z"
            fill="url(#petG-id)" stroke="#FF8FBC" stroke-width="0.6"/>
    </g>
  </defs>

  <!-- Breathing aura -->
  <circle cx="80" cy="80" r="56" fill="url(#auraG)">
    <animate attributeName="r" values="52;60;52" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(80 80)">
    <!-- Petal 1 — swaying -->
    <g transform="rotate(0)">
      <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="3s" repeatCount="indefinite" additive="sum"/>
      <use href="#petal-id"/>
    </g>
    <!-- Petals 2-5 static -->
    <use href="#petal-id" transform="rotate(72)"/>
    <use href="#petal-id" transform="rotate(144)"/>
    <use href="#petal-id" transform="rotate(216)"/>
    <use href="#petal-id" transform="rotate(288)"/>

    <!-- Center with gentle pulse -->
    <circle cx="0" cy="0" r="12" fill="url(#ctrG-id)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-3.5" cy="-4" r="4" fill="#FFF9F5" opacity="0.7"/>
  </g>
</svg>
