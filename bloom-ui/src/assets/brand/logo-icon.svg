<?xml version="1.0" encoding="UTF-8"?>
<!-- Bloom Community – Icon Only (flower in rounded frame, favicon/app icon) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Bloom">
  <defs>
    <radialGradient id="bgGrad-i" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FFF0E8"/>
      <stop offset="55%" stop-color="#FFD9E8"/>
      <stop offset="100%" stop-color="#FFB7D5"/>
    </radialGradient>
    <radialGradient id="petalGrad-i" cx="50%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#FFE6EF"/>
      <stop offset="50%" stop-color="#FFB7D5"/>
      <stop offset="100%" stop-color="#FF8FBC"/>
    </radialGradient>
    <radialGradient id="centerGrad-i" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#FFF4D4"/>
      <stop offset="55%" stop-color="#F0C27B"/>
      <stop offset="100%" stop-color="#D9A862"/>
    </radialGradient>
    <filter id="softShadow-i" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offBlur"/>
      <feFlood flood-color="#FF8FBC" flood-opacity="0.45"/>
      <feComposite in2="offBlur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square backdrop (adaptive icon safe-zone compatible) -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad-i)" stroke="#FF8FBC" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Inner glow -->
  <rect x="12" y="12" width="104" height="104" rx="26" fill="none" stroke="#FFF9F5" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Flower centered -->
  <g transform="translate(64 64) scale(1.1)" filter="url(#softShadow-i)">
    <g>
      <path d="M 0 0 C -11 -3 -21 -24 -9 -38 C -4 -43 0 -43 0 -43 C 0 -43 4 -43 9 -38 C 21 -24 11 -3 0 0 Z"
            fill="url(#petalGrad-i)" stroke="#FF8FBC" stroke-width="0.6" transform="rotate(0)"/>
      <path d="M 0 0 C -11 -3 -21 -24 -9 -38 C -4 -43 0 -43 0 -43 C 0 -43 4 -43 9 -38 C 21 -24 11 -3 0 0 Z"
            fill="url(#petalGrad-i)" stroke="#FF8FBC" stroke-width="0.6" transform="rotate(72)"/>
      <path d="M 0 0 C -11 -3 -21 -24 -9 -38 C -4 -43 0 -43 0 -43 C 0 -43 4 -43 9 -38 C 21 -24 11 -3 0 0 Z"
            fill="url(#petalGrad-i)" stroke="#FF8FBC" stroke-width="0.6" transform="rotate(144)"/>
      <path d="M 0 0 C -11 -3 -21 -24 -9 -38 C -4 -43 0 -43 0 -43 C 0 -43 4 -43 9 -38 C 21 -24 11 -3 0 0 Z"
            fill="url(#petalGrad-i)" stroke="#FF8FBC" stroke-width="0.6" transform="rotate(216)"/>
      <path d="M 0 0 C -11 -3 -21 -24 -9 -38 C -4 -43 0 -43 0 -43 C 0 -43 4 -43 9 -38 C 21 -24 11 -3 0 0 Z"
            fill="url(#petalGrad-i)" stroke="#FF8FBC" stroke-width="0.6" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="12" fill="url(#centerGrad-i)"/>
    <circle cx="-3.5" cy="-4" r="4" fill="#FFF9F5" opacity="0.75"/>
    <circle cx="4" cy="-1" r="1.3" fill="#D9A862"/>
    <circle cx="-1" cy="4" r="1.3" fill="#D9A862"/>
  </g>

  <!-- Corner sparkles -->
  <g fill="#FFE8A8" opacity="0.9">
    <path d="M 22 28 l 1.2 -4 l 1.2 4 l 4 1.2 l -4 1.2 l -1.2 4 l -1.2 -4 l -4 -1.2 Z"/>
    <path d="M 102 100 l 1 -3.5 l 1 3.5 l 3.5 1 l -3.5 1 l -1 3.5 l -1 -3.5 l -3.5 -1 Z"/>
  </g>
</svg>
